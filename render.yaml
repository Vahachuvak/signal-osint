services:
  - type: web
    name: signal-osint
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn site_app:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SIGNAL_PUBLIC
        value: "1"
      - key: SIGNAL_TRUST_PROXY
        value: "1"
